<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเฉลยผลรางวัล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4 max-w-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">🏆 หน้าเฉลยผลรางวัล</h1>
            <div class="space-x-2 text-sm">
                <a href="add.html" class="text-blue-600 hover:underline">← กลับหน้ากรอกข้อมูล</a>
                <a href="index.html" class="text-gray-600 hover:underline">หน้าแรก</a>
            </div>
        </div>

        <!-- ส่วนกดออกผล -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6 space-y-4">
            <h2 class="text-lg font-semibold">เลือกฝั่งที่ชนะและรูปแบบผลลัพธ์</h2>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ฝั่งที่ชนะหลัก:</label>
                <select id="winning-choice" class="w-full p-2 border rounded-md">
                    <option value="blue">น้ำเงินชนะ (Blue Win)</option>
                    <option value="red">แดงชนะ (Red Win)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ลักษณะผล (แฮนดิแคป/ราคาต่อรอง):</label>
                <select id="settle-type" class="w-full p-2 border rounded-md">
                    <option value="win">ชนะเต็มอัตรา (Win Full)</option>
                    <option value="win_half">ชนะราคา (ได้ครึ่ง / Win Half)</option>
                    <option value="draw">เสมอ / คืนทุน (Draw / Refund)</option>
                    <option value="lose_half">แพ้ราคา (เสียครึ่ง / Lose Half)</option>
                </select>
            </div>
            <button onclick="processGame()" class="w-full bg-green-600 text-white p-3 rounded-md hover:bg-green-700 font-bold">ยืนยันประมวลผลรายการที่ค้างอยู่</button>
        </div>

        <!-- รายการที่รอตรวจผลอยู่ -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-semibold mb-4">รายการที่รอผลอยู่ (Pending)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-2">ผู้เล่น</th>
                            <th class="p-2">ฝั่งที่แทง</th>
                            <th class="p-2">จำนวนเงิน</th>
                        </tr>
                    </thead>
                    <tbody id="pending-list" class="text-sm">
                        <tr><td colspan="3" class="p-3 text-center">กำลังโหลด...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadPendingBets() {
            const listEl = document.getElementById('pending-list');
            const { data, error } = await supabase
                .from('bets')
                .select(`id, choice, amount, users ( name )`)
                .eq('result', 'pending')
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                listEl.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-gray-500">ไม่มีรายการที่รอผล</td></tr>';
                return;
            }

            listEl.innerHTML = '';
            data.forEach(bet => {
                const tr = document.createElement('tr');
                tr.className = 'border-b';
                let choiceText = bet.choice === 'blue' ? '<span class="text-blue-600 font-bold">น้ำเงิน</span>' : '<span class="text-red-600 font-bold">แดง</span>';
                tr.innerHTML = `
                    <td class="p-2">${bet.users ? bet.users.name : '-'}</td>
                    <td class="p-2">${choiceText}</td>
                    <td class="p-2">${Number(bet.amount).toLocaleString()}</td>
                `;
                listEl.appendChild(tr);
            });
        }

        async function processGame() {
            const winningChoice = document.getElementById('winning-choice').value;
            const settleType = document.getElementById('settle-type').value;

            if (!confirm(`ยืนยันการออกผลโดยให้ฝั่ง "${winningChoice === 'blue' ? 'น้ำเงิน' : 'แดง'}" เป็นฝ่ายชนะ (${settleType}) ใช่หรือไม่?`)) return;

            const { data: pendingBets } = await supabase
                .from('bets')
                .select('*')
                .eq('result', 'pending');

            if (!pendingBets || pendingBets.length === 0) {
                alert('ไม่มีรายการให้คำนวณ');
                return;
            }

            for (let bet of pendingBets) {
                let resultStatus = 'lose';
                let profit = -bet.amount;
                let rate = (bet.choice === 'blue') ? 1.0 : 0.95; // อัตราจ่ายน้ำเงิน 1x, แดง 0.95x

                if (bet.choice === winningChoice) {
                    // กรณีเลือกฝั่งที่ชนะ
                    if (settleType === 'win') {
                        resultStatus = 'win';
                        profit = bet.amount * rate;
                    } else if (settleType === 'win_half') {
                        resultStatus = 'win_half';
                        profit = (bet.amount * rate) / 2;
                    } else if (settleType === 'draw') {
                        resultStatus = 'draw';
                        profit = 0; // คืนทุน
                    }
                } else {
                    // กรณีเลือกฝั่งตรงข้าม (แพ้)
                    if (settleType === 'win_half') {
                        // ถ้าฝั่งหลักชนะแบบได้ครึ่ง ฝั่งตรงข้ามจะเสียครึ่ง
                        resultStatus = 'lose_half';
                        profit = -(bet.amount / 2);
                    } else if (settleType === 'draw') {
                        resultStatus = 'draw';
                        profit = 0; // เสมอคืนทุน
                    } else {
                        resultStatus = 'lose';
                        profit = -bet.amount;
                    }
                }

                await supabase
                    .from('bets')
                    .update({ result: resultStatus, profit: profit })
                    .eq('id', bet.id);
            }

            alert('ประมวลผลและคำนวณยอดเงินเรียบร้อยแล้ว!');
            loadPendingBets();
        }

        loadPendingBets();
    </script>
</body>
</html>
