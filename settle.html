<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเฉลยผลรางวัล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4">
    <div class="max-w-2xl mx-auto py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">🏆 หน้าเฉลยผลรางวัล</h1>
            <div class="space-x-3 text-sm">
                <a href="add.html" class="text-blue-600 hover:underline">← กรอกข้อมูล</a>
                <a href="index.html" class="text-slate-500 hover:underline">หน้าแรก</a>
            </div>
        </div>

        <!-- Action Card -->
        <div class="bg-white border border-slate-200 rounded-3xl shadow-sm p-6 mb-6 space-y-4">
            <h2 class="text-base font-semibold text-slate-900">ตั้งค่าผลการแข่งขันรอบนี้</h2>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">ฝั่งที่ชนะหลัก</label>
                <select id="winning-choice" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-blue-600 transition">
                    <option value="blue">💧 น้ำเงินชนะ (Blue Win)</option>
                    <option value="red">🔥 แดงชนะ (Red Win)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">ลักษณะผล (ราคาต่อรอง)</label>
                <select id="settle-type" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-blue-600 transition">
                    <option value="win">ชนะเต็มอัตรา (Win Full)</option>
                    <option value="win_half">ชนะราคา (ได้ครึ่ง / Win Half)</option>
                    <option value="draw">เสมอ / คืนทุน (Draw / Refund)</option>
                    <option value="lose_half">แพ้ราคา (เสียครึ่ง / Lose Half)</option>
                </select>
            </div>
            <button onclick="processGame()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition shadow-sm">
                ยืนยันประมวลผลรายการที่ค้างอยู่
            </button>
        </div>

        <!-- Pending List Card -->
        <div class="bg-white border border-slate-200 rounded-3xl shadow-sm p-6">
            <h2 class="text-base font-semibold text-slate-900 mb-4">รายการที่รอผลอยู่ (Pending)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="p-3 font-semibold">ผู้เล่น</th>
                            <th class="p-3 font-semibold">ฝั่งที่แทง</th>
                            <th class="p-3 font-semibold text-right">จำนวนเงิน</th>
                        </tr>
                    </thead>
                    <tbody id="pending-list" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="3" class="p-4 text-center text-slate-400">กำลังโหลด...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xkatsdukvbauuujppgnk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrYXRzZHVrdmJhdXV1anBwZ25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTYyMTksImV4cCI6MjEwOTE3MjIxOX0.bPUs0yB41A7gxYPpUZy9aQfVVuNxRvKPsPOMVIG9_i8';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadPendingBets() {
            const listEl = document.getElementById('pending-list');
            const { data, error } = await db
                .from('bets')
                .select(`id, choice, amount, users ( name )`)
                .eq('result', 'pending')
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                listEl.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-400">ไม่มีรายการที่รอผล</td></tr>';
                return;
            }

            listEl.innerHTML = '';
            data.forEach(bet => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                let choiceText = bet.choice === 'blue' 
                    ? '<span class="text-blue-600 font-semibold">💧 น้ำเงิน</span>' 
                    : '<span class="text-rose-600 font-semibold">🔥 แดง</span>';
                tr.innerHTML = `
                    <td class="p-3 text-slate-900 font-medium">${bet.users ? bet.users.name : '-'}</td>
                    <td class="p-3">${choiceText}</td>
                    <td class="p-3 text-right text-slate-600">${Number(bet.amount).toLocaleString()}</td>
                `;
                listEl.appendChild(tr);
            });
        }

        async function processGame() {
            const winningChoice = document.getElementById('winning-choice').value;
            const settleType = document.getElementById('settle-type').value;

            if (!confirm(`ยืนยันการออกผลโดยให้ฝั่ง "${winningChoice === 'blue' ? 'น้ำเงิน' : 'แดง'}" ชนะ (${settleType}) ใช่หรือไม่?`)) return;

            const { data: pendingBets } = await db
                .from('bets')
                .select('*')
                .eq('result', 'pending');

            if (!pendingBets || pendingBets.length === 0) {
                alert('ไม่มีรายการให้คำนวณ');
                return;
            }

            for (let bet of pendingBets) {
                let resultStatus = 'lose';
                let profit = -bet.amount;
                let rate = (bet.choice === 'blue') ? 1.0 : 0.95;

                if (bet.choice === winningChoice) {
                    if (settleType === 'win') {
                        resultStatus = 'win';
                        profit = bet.amount * rate;
                    } else if (settleType === 'win_half') {
                        resultStatus = 'win_half';
                        profit = (bet.amount * rate) / 2;
                    } else if (settleType === 'draw') {
                        resultStatus = 'draw';
                        profit = 0;
                    }
                } else {
                    if (settleType === 'win_half') {
                        resultStatus = 'lose_half';
                        profit = -(bet.amount / 2);
                    } else if (settleType === 'draw') {
                        resultStatus = 'draw';
                        profit = 0;
                    } else {
                        resultStatus = 'lose';
                        profit = -bet.amount;
                    }
                }

                await db
                    .from('bets')
                    .update({ result: resultStatus, profit: profit })
                    .eq('id', bet.id);
            }

            alert('ประมวลผลและคำนวณยอดเงินเรียบร้อยแล้ว!');
            loadPendingBets();
        }

        loadPendingBets();
    </script>
</body>
</html>
