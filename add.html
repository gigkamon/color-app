<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูลการเดิมพัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">📝 เพิ่มรายการ</h1>
            <div class="space-x-3 text-sm">
                <a href="settle.html" class="text-blue-400 hover:underline">เฉลยผล →</a>
                <a href="index.html" class="text-slate-400 hover:underline">หน้าแรก</a>
            </div>
        </div>

        <form id="bet-form" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ชื่อผู้เล่น</label>
                <input type="text" id="username" required placeholder="ระบุชื่อผู้เล่น" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">เลือกฝั่ง</label>
                <select id="choice" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    <option value="blue">💧 น้ำเงิน (อัตราจ่าย 1 เท่า)</option>
                    <option value="red">🔥 แดง (อัตราจ่าย 0.95 เท่า)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">จำนวนเงิน</label>
                <input type="number" id="amount" step="any" required placeholder="0.00" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/20">
                บันทึกข้อมูล
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://xkatsdukvbauuujppgnk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrYXRzZHVrdmJhdXV1anBwZ25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTYyMTksImV4cCI6MjEwOTE3MjIxOX0.bPUs0yB41A7gxYPpUZy9aQfVVuNxRvKPsPOMVIG9_i8';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('bet-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const choice = document.getElementById('choice').value;
            const amount = parseFloat(document.getElementById('amount').value);

            let { data: userData } = await db
                .from('users')
                .select('id')
                .eq('name', username)
                .single();

            let userId;
            if (!userData) {
                const { data: newUser, error: createError } = await db
                    .from('users')
                    .insert([{ name: username }])
                    .select('id')
                    .single();
                if (createError) { alert('เกิดข้อผิดพลาดในการสร้างผู้ใช้'); return; }
                userId = newUser.id;
            } else {
                userId = userData.id;
            }

            const { error: betError } = await db
                .from('bets')
                .insert([{ user_id: userId, choice: choice, amount: amount, result: 'pending', profit: 0 }]);

            if (betError) {
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            } else {
                alert('บันทึกข้อมูลสำเร็จ!');
                document.getElementById('bet-form').reset();
            }
        });
    </script>
</body>
</html>
