<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแสดงผลการลงเดิมพัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4 max-w-4xl">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">📊 ตารางแสดงผลผู้เล่น</h1>
            <div class="space-x-2 text-sm">
                <a href="add.html" class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">ไปหน้ากรอกข้อมูล (แอดมิน)</a>
                <a href="settle.html" class="bg-gray-800 text-white px-3 py-2 rounded hover:bg-gray-700">ไปหน้าเฉลยผล (แอดมิน)</a>
            </div>
        </header>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-left text-sm">
                        <th class="p-3">ชื่อผู้เล่น</th>
                        <th class="p-3">ฝั่งที่ลง</th>
                        <th class="p-3">จำนวนเงิน</th>
                        <th class="p-3">ผลลัพธ์</th>
                        <th class="p-3">กำไร/ขาดทุน</th>
                    </tr>
                </thead>
                <tbody id="bet-table-body" class="text-sm">
                    <tr><td colspan="5" class="p-4 text-center">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchBets() {
            const tableBody = document.getElementById('bet-table-body');
            
            const { data, error } = await supabase
                .from('bets')
                .select(`id, choice, amount, result, profit, users ( name )`)
                .order('created_at', { ascending: false });

            if (error || !data) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
                return;
            }

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">ยังไม่มีข้อมูลการลงเดิมพัน</td></tr>';
                return;
            }

            tableBody.innerHTML = '';
            data.forEach(bet => {
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50';

                let badgeColor = bet.choice === 'blue' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800';
                let choiceText = bet.choice === 'blue' ? 'น้ำเงิน (1x)' : 'แดง (0.95x)';
                
                let resultText = 'รอดำเนินการ';
                let resultColor = 'text-gray-500';
                
                if (bet.result === 'win') { resultText = 'ชนะ (เต็ม)'; resultColor = 'text-green-600 font-bold'; }
                else if (bet.result === 'win_half') { resultText = 'ชนะ (ครึ่ง)'; resultColor = 'text-green-500 font-bold'; }
                else if (bet.result === 'draw') { resultText = 'เสมอ (คืนทุน)'; resultColor = 'text-yellow-600 font-bold'; }
                else if (bet.result === 'lose_half') { resultText = 'แพ้ (ครึ่ง)'; resultColor = 'text-orange-500 font-bold'; }
                else if (bet.result === 'lose') { resultText = 'แพ้ (เต็ม)'; resultColor = 'text-red-600 font-bold'; }

                let profitClass = bet.profit > 0 ? 'text-green-600 font-bold' : (bet.profit < 0 ? 'text-red-600 font-bold' : 'text-gray-600');

                row.innerHTML = `
                    <td class="p-3">${bet.users ? bet.users.name : 'ไม่ระบุชื่อ'}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs ${badgeColor}">${choiceText}</span></td>
                    <td class="p-3">${Number(bet.amount).toLocaleString()}</td>
                    <td class="p-3 ${resultColor}">${resultText}</td>
                    <td class="p-3 ${profitClass}">${bet.profit ? Number(bet.profit).toLocaleString() : '0'}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        fetchBets();
    </script>
</body>
</html>
