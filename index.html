<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการลงเดิมพัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                    📊 <span class="text-blue-600">ตารางผลการเดิมพัน</span>
                </h1>
                <p class="text-slate-500 text-sm mt-1">อัปเดตสถานะและผลกำไรแบบเรียลไทม์</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <a href="add.html" class="flex-1 sm:flex-none text-center bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow-sm">➕ กรอกข้อมูล</a>
                <a href="settle.html" class="flex-1 sm:flex-none text-center bg-white hover:bg-slate-100 text-slate-700 px-4 py-2.5 rounded-xl font-medium text-sm transition border border-slate-300 shadow-sm">🏆 หน้าเฉลยผล</a>
            </div>
        </div>

        <!-- Table Card -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="p-4 font-semibold">ชื่อผู้เล่น</th>
                            <th class="p-4 font-semibold">ฝั่งที่ลง</th>
                            <th class="p-4 font-semibold">จำนวนเงิน</th>
                            <th class="p-4 font-semibold">ผลลัพธ์</th>
                            <th class="p-4 font-semibold text-right">กำไร / ขาดทุน</th>
                        </tr>
                    </thead>
                    <tbody id="bet-table-body" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xkatsdukvbauuujppgnk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrYXRzZHVrdmJhdXV1anBwZ25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTYyMTksImV4cCI6MjEwOTE3MjIxOX0.bPUs0yB41A7gxYPpUZy9aQfVVuNxRvKPsPOMVIG9_i8';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchBets() {
            const tableBody = document.getElementById('bet-table-body');
            const { data, error } = await db
                .from('bets')
                .select(`id, choice, amount, result, profit, users ( name )`)
                .order('created_at', { ascending: false });

            if (error || !data) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-rose-600">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
                return;
            }

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">ยังไม่มีข้อมูลการลงเดิมพันในระบบ</td></tr>';
                return;
            }

            tableBody.innerHTML = '';
            data.forEach(bet => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition';

                let badge = bet.choice === 'blue' 
                    ? '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">💧 น้ำเงิน (1x)</span>' 
                    : '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">🔥 แดง (0.95x)</span>';
                
                let resultBadge = '<span class="text-slate-400">รอดำเนินการ</span>';
                if (bet.result === 'win') resultBadge = '<span class="text-emerald-600 font-semibold">ชนะ (เต็ม)</span>';
                else if (bet.result === 'win_half') resultBadge = '<span class="text-emerald-600 font-semibold">ชนะ (ครึ่ง)</span>';
                else if (bet.result === 'draw') resultBadge = '<span class="text-amber-600 font-semibold">เสมอ (คืนทุน)</span>';
                else if (bet.result === 'lose_half') resultBadge = '<span class="text-orange-600 font-semibold">แพ้ (ครึ่ง)</span>';
                else if (bet.result === 'lose') resultBadge = '<span class="text-rose-600 font-semibold">แพ้ (เต็ม)</span>';

                let profitFormatted = Number(bet.profit || 0).toLocaleString();
                let profitClass = bet.profit > 0 ? 'text-emerald-600 font-bold' : (bet.profit < 0 ? 'text-rose-600 font-bold' : 'text-slate-600');
                if (bet.profit > 0) profitFormatted = '+' + profitFormatted;

                row.innerHTML = `
                    <td class="p-4 font-medium text-slate-900">${bet.users ? bet.users.name : 'ไม่ระบุชื่อ'}</td>
                    <td class="p-4">${badge}</td>
                    <td class="p-4 text-slate-600">${Number(bet.amount).toLocaleString()}</td>
                    <td class="p-4">${resultBadge}</td>
                    <td class="p-4 text-right ${profitClass}">${profitFormatted}</td>
                `;
                tableBody.appendChild(row);
            });
        }
        fetchBets();
    </script>
</body>
</html>
