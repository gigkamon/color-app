<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแสดงผลการลงเดิมพัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4 max-w-4xl">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">📊 ตารางแสดงผลผู้เล่น</h1>
            <a href="admin.html" class="bg-gray-800 text-white px-4 py-2 rounded text-sm hover:bg-gray-700">เข้าสู่ระบบแอดมิน</a>
        </header>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-left">
                        <th class="p-3">ชื่อผู้เล่น</th>
                        <th class="p-3">ฝั่งที่ลง</th>
                        <th class="p-3">จำนวนเงิน</th>
                        <th class="p-3">ผลลัพธ์</th>
                        <th class="p-3">กำไร/ขาดทุน</th>
                    </tr>
                </thead>
                <tbody id="bet-table-body">
                    <!-- ข้อมูลจะถูกดึงมาแสดงตรงนี้ด้วย JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
